site_name: 한글 가이드 문서
site_url: https://sitename.example
theme:
  name: material
  language: ko
  logo: assets/img/griptape_nodes_header_logo.svg
  palette:
    - scheme: slate        # dark
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb-outline
        name: 라이트 모드로 전환
    - scheme: default      # light
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb
        name: 다크 모드로 전환
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.top
    - navigation.tabs.sticky
    - navigation.sections

markdown_extensions:
  - pymdownx.highlight
  - admonition
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - md_in_html
  - toc:
      toc_depth: 3

extra_css:
  - assets/css/extra.css


